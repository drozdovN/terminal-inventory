{% extends "base.html" %}
{% block content %}
<h1>Удалённый доступ — Терминал #{{ terminal.id }}</h1>
<p>Серийный номер: <strong>{{ terminal.serial_number }}</strong></p>
<p>Статус подключения: <span id="status" style="color: gray;">Ожидание...</span></p>

<div style="position: relative; display: inline-block; border: 2px solid #333; margin-top: 10px;">
    <canvas id="screen" width="480" height="800" style="background: #000; cursor: crosshair;"></canvas>
</div>

<p style="margin-top: 10px; color: #888;">Кликните по экрану для эмуляции касания</p>

<a href="/terminals/{{ terminal.id }}" class="btn mt-20">← Назад к карточке</a>

<script>
    const terminalId = {{ terminal.id }};
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const wsUrl = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/terminals/ws/support/${terminalId}`;
    
    const img = new Image();
    let ws;

    function connect() {
        ws = new WebSocket(wsUrl);
        
        ws.onopen = () => {
            statusEl.textContent = 'Подключено к серверу';
            statusEl.style.color = 'green';
            // Запрашиваем скриншот у терминала
            ws.send(JSON.stringify({type: 'request_screen_capture'}));
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'frame') {
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                };
                img.src = 'data:image/jpeg;base64,' + data.data;
            }
        };
        
        ws.onclose = () => {
            statusEl.textContent = 'Соединение потеряно. Переподключение...';
            statusEl.style.color = 'red';
            setTimeout(connect, 3000);
        };
        
        ws.onerror = () => {
            statusEl.textContent = 'Ошибка подключения';
            statusEl.style.color = 'red';
        };
    }

    canvas.addEventListener('click', (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = Math.round((e.clientX - rect.left) * scaleX);
        const y = Math.round((e.clientY - rect.top) * scaleY);
        
        ws.send(JSON.stringify({
            type: 'tap',
            x: x,
            y: y
        }));
        
        // Визуальная обратная связь
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
        ctx.fill();
        setTimeout(() => {
            if (img.src) ctx.drawImage(img, 0, 0);
        }, 300);
    });

    connect();
</script>
{% endblock %}

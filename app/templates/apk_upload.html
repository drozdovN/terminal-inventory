{% extends "base.html" %}
{% block content %}
<h1>📦 Загрузить обновление</h1>

<form action="/terminals/apk/upload" method="post" enctype="multipart/form-data">
    <label>APK файл:</label>
    <input type="file" name="file" accept=".apk" required>

    <label>Версия:</label>
    <input type="text" name="version" placeholder="1.0.0" required>

    <label>Описание:</label>
    <textarea name="description" rows="2" placeholder="Что нового в этой версии"></textarea>

    <label>Отправить на:</label>
    <select name="target_serial">
        <option value="">Всем терминалам</option>
        {% for t in terminals %}
        <option value="{{ t.serial_number }}">{{ t.serial_number }} — {{ t.model }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="success">📤 Загрузить</button>
</form>

<a href="/terminals/apk/list" class="btn mt-20">← К списку APK</a>
{% endblock %}
